name: Reconcile actual Hungary native and verify corrected terminal readback
on:
  push:
    branches: [qa/hungary481-terminal-readback-control]
permissions:
  actions: read
  contents: read
jobs:
  verify:
    if: github.repository == 'YouthOpps/data-pipeline' && github.event.created && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read the authentic completed evidence and test bounded terminal readback
        uses: ./qa/hu481-readback-control
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Install exact immutable uploader bundle
        if: ${{ false }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          path: qa/hu481-readback-control/action.yml
