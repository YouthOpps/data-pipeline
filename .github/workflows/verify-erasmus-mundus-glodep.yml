name: Verify GLODEP consortium scholarship call

on:
  push:
    branches: [qa/461-glodep-consortium-native]

permissions:
  actions: read
  contents: read
  issues: read

concurrency:
  group: youthopps-glodep-consortium-publisher-v1
  cancel-in-progress: false

jobs:
  verify:
    if: false && github.repository == 'YouthOpps/data-pipeline' && github.ref == 'refs/heads/qa/461-glodep-consortium-native' && github.event.created == true && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: YouthOpps/youthopps.github.io
          ref: 2ed1f4f7c16c0a1b65c3e96c78c41c2532a04f23
          path: website
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exercise the original nonpublishing GLODEP collector in RAM
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -B qa-glodep461/observer.py
      - name: Retain derived run evidence and acknowledged publisher state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: glodep-native-result-${{ github.run_attempt }}
          path: ${{ runner.temp }}/glodep461-native-result
          if-no-files-found: error
          retention-days: 7
