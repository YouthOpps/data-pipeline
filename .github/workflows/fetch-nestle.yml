name: Fetch Nestle internships and university jobs

on:
  push:
    branches: [main]
    paths:
      - adapters/nestle/**
      - .github/workflows/fetch-nestle.yml
  schedule:
    - cron: '43 13 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: youthopps-nestle-publisher-research-v1
  cancel-in-progress: false
  queue: max

jobs:
  collect:
    if: >-
      github.repository == 'YouthOpps/data-pipeline' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Authenticate source-only publication
        id: token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.WEBSITE_APP_ID }}
          private-key: ${{ secrets.WEBSITE_APP_PRIVATE_KEY }}
          owner: YouthOpps
          repositories: data-source
          permission-contents: write
      - name: Collect and publish reviewed Nestle category
        id: collect
        run: python -B adapters/nestle/adapter.py --publish
        env:
          DATA_SOURCE_TOKEN: ${{ steps.token.outputs.token }}
          GITHUB_TOKEN: ${{ github.token }}
          NESTLE_PACING_ARTIFACT_PATH: ${{ runner.temp }}/pacing-state.json
      - name: Preserve exact owned Nestle pacing state
        if: always() && steps.collect.outputs.pacing_ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: nestle-pacing-state-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pacing-state.json
          if-no-files-found: error
          retention-days: 90
