name: fetch-be-fulbright-belgium-luxembourg
on:
  push:
    branches: [main]
    paths:
      - 'adapters/be-fulbright-belgium-luxembourg/**'
      - '.github/workflows/fetch-be-fulbright-belgium-luxembourg.yml'
  workflow_dispatch:
  schedule:
    - cron: '50 8 * * *'
permissions:
  contents: read
  actions: read
concurrency:
  group: youthopps-be-fulbright-belgium-luxembourg-publisher-v1
  queue: max
  cancel-in-progress: false
jobs:
  collect:
    if: github.repository == 'YouthOpps/data-pipeline' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Create data-source publication token
        id: data-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ vars.WEBSITE_APP_ID }}
          private-key: ${{ secrets.WEBSITE_APP_PRIVATE_KEY }}
          owner: YouthOpps
          repositories: data-source
          permission-contents: write
      - name: Collect and publish this source
        env:
          DATA_SOURCE_TOKEN: ${{ steps.data-token.outputs.token }}
          GITHUB_TOKEN: ${{ github.token }}
          FULBRIGHT_PACING_ARTIFACT_PATH: ${{ runner.temp }}/pacing-state.json
        run: python -B adapters/be-fulbright-belgium-luxembourg/adapter.py --publish
      - name: Retain exact run-attempt publisher state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fulbright-publisher-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pacing-state.json
          if-no-files-found: error
          retention-days: 90
