name: Google 484 offline controls
on:
  push:
    branches: [qa/484-google-offline-1705263]
permissions:
  contents: read
jobs:
  controls:
    if: github.event.created && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify the delivered adapter and workflow match the reviewed revision
        run: |
          test "$(git cat-file -p HEAD | awk '/^parent / {print $2; exit}')" = 17052636f6ebdb702040541687a6b9c92dc5f4f2
      - name: Exercise policy bounds, pending evidence and refusal paths without publisher access
        run: python -B .github/qa/google484.py
