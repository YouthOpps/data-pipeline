name: fetch-us-nasa-internships
on:
  schedule:
    - cron: '11 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - adapters/us-nasa-internships/**
      - .github/workflows/fetch-us-nasa-internships.yml
permissions:
  actions: read
  contents: read
concurrency:
  group: youthopps-us-nasa-internships-publisher-v1
  queue: max
  cancel-in-progress: false
jobs:
  collect:
    if: github.repository == 'YouthOpps/data-pipeline' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Create data-source publication token
        id: data-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ vars.WEBSITE_APP_ID }}
          private-key: ${{ secrets.WEBSITE_APP_PRIVATE_KEY }}
          owner: YouthOpps
          repositories: data-source
          permission-contents: write
      - name: Collect and publish this source
        id: collect
        env:
          DATA_SOURCE_TOKEN: ${{ steps.data-token.outputs.token }}
          GITHUB_TOKEN: ${{ github.token }}
          NASA_PACING_ARTIFACT_PATH: ${{ runner.temp }}/pacing-state.json
          NASA_PACING_MAINTENANCE: >-
            {"schema":1,"family":"youthopps-us-nasa-internships-publisher-v1","evidence":"https://github.com/YouthOpps/data-pipeline/issues/269#issuecomment-6202558732","state":{"schema":3,"family":"youthopps-us-nasa-internships-publisher-v1","observed_at":1792098971.0031197,"not_before":1792099031.3439543,"starts":[1791473355.0,1791966337.0,1792040784.0,1792060573.0,1792067310.0,1792079295.0,1792098956.6148908,1792098957.3451345,1792098957.546229,1792098957.5478132,1792098969.7569516,1792098969.9032505,1792098970.123884,1792098970.9996052],"blocked":false,"interval":12.2,"completed":1792098971.0031197,"page_interval":30,"last_inventory_completed":1792079295.0,"rate_limit_strikes":0,"rate_limit_until":0,"legacy_rate_history_unknown":true,"in_flight":false,"flight_id":"e945a3202f540bf02beec5c17c140306","flight_started":1792098969.7569516,"completed_flight_id":"e945a3202f540bf02beec5c17c140306"}}
        run: python -B adapters/us-nasa-internships/adapter.py --publish
      - name: Preserve owned publisher pacing state
        if: always() && steps.collect.outputs.pacing_ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: us-nasa-internships-pacing-state-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pacing-state.json
          if-no-files-found: error
          retention-days: 90
