name: FRSE 501 verified programme-overview native QA
on:
  push:
    branches: [qa/501-native2-preflight, qa/501-native2-live]
permissions:
  contents: read
  actions: read
concurrency:
  group: youthopps-frse-publisher-v1
  queue: max
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: YouthOpps/youthopps.github.io
          ref: 16988009c49f282cec94f33dc3677a370abea0c5
          path: website
          persist-credentials: false
      - name: Verify exact run, candidate, previous owner and real ZIP
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -B .github/qa/frse501-prepare.py
      - name: Prepare isolated maintenance runner
        run: |
          docker pull python:3.12-slim-bookworm
          mkdir -m 700 "$RUNNER_TEMP/frse-evidence"
          mkdir -m 700 /dev/shm/frse501
          python -m py_compile .github/qa/frse501-prepare.py .github/qa/frse501-native.py .github/qa/sitecustomize.py
      - name: Confirm container journal ownership without any network access
        run: |
          docker run --rm --network none --read-only --user "$(id -u):$(id -g)" --tmpfs /tmp \
            -v "$GITHUB_WORKSPACE:/src:ro" -v "$RUNNER_TEMP/frse-seed:/tmp/youthopps-frse-publisher-v1-$(id -u)" \
            -e TMPDIR=/tmp -w /src/adapters/pl-frse python:3.12-slim-bookworm \
            python -B -c 'import adapter as a; a.require_existing_local_state(); print("Exact native mature-state journal accepted with network disabled")'
      - name: Run actual publisher collection without production credentials
        if: github.ref == 'refs/heads/qa/501-native2-live'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          docker run --rm --read-only --user "$(id -u):$(id -g)" --tmpfs /tmp \
            -v "$GITHUB_WORKSPACE:/src:ro" -v "/dev/shm/frse501:/ram" \
            -v "$RUNNER_TEMP/frse-seed:/tmp/youthopps-frse-publisher-v1-$(id -u)" \
            -e GITHUB_TOKEN -e TMPDIR=/tmp -w /src python:3.12-slim-bookworm \
            python -B .github/qa/frse501-native.py
      - name: Validate all accepted native IDs with the pinned website consumer
        if: github.ref == 'refs/heads/qa/501-native2-live' && success()
        run: |
          node --input-type=module <<'JS'
          import {readFile,readdir} from 'node:fs/promises';
          import assert from 'node:assert/strict';
          import {loadData} from './website/scripts/data.mjs';
          for (const name of await readdir('/dev/shm/frse501/consumer')) {
            const root = '/dev/shm/frse501/consumer/'+name;
            const records = JSON.parse(await readFile(root+'/pl-frse/data.json','utf8'));
            const data = await loadData(root);
            assert.deepEqual(data.opportunities.map(x=>x.id).sort(),records.map(x=>x.id).sort());
            console.log(name, records.length, 'native IDs accepted');
          }
          JS
      - name: Preserve the actual terminal journal and receipts for handback review
        if: always() && github.ref == 'refs/heads/qa/501-native2-live'
        run: |
          cp "$RUNNER_TEMP/frse-seed/state.json" "$RUNNER_TEMP/frse-evidence/terminal-state.json"
          if test -f /dev/shm/frse501/proof.json; then cp /dev/shm/frse501/proof.json "$RUNNER_TEMP/frse-evidence/receipts.json"; fi
          sha256sum "$RUNNER_TEMP/frse-evidence/terminal-state.json"
      - uses: actions/upload-artifact@v4
        if: always() && github.ref == 'refs/heads/qa/501-native2-live'
        with:
          name: frse-501-second-native-state-1
          path: ${{ runner.temp }}/frse-evidence/
          if-no-files-found: error
