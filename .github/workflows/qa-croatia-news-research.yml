name: qa-croatia-news-research
on:
  push:
    branches: [qa/croatia-news-research]
permissions:
  actions: read
  issues: read
  contents: read
concurrency:
  group: youthopps-studyincroatia-publisher-v1
  queue: max
  cancel-in-progress: false
jobs:
  research:
    if: github.repository == 'YouthOpps/data-pipeline' && github.ref == 'refs/heads/qa/croatia-news-research' && github.run_attempt == 1 && github.event.created == true
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Capture only earlier unverified catalogue pages
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -B qa/croatia-news/runner.py
      - name: Retain timing state and encrypted research evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: croatia-news-research-${{ github.run_attempt }}
          path: ${{ runner.temp }}/croatia-news/
          if-no-files-found: ignore
          retention-days: 7
