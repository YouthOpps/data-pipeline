name: fetch-lu-luxembourg-cooperation
on:
  push:
    branches: [main]
    paths:
      - 'adapters/lu-luxembourg-cooperation/**'
      - '.github/workflows/fetch-lu-luxembourg-cooperation.yml'
  workflow_dispatch:
  schedule:
    - cron: '30 23 * * *'
permissions:
  contents: read
  actions: read
concurrency:
  group: youthopps-lu-luxembourg-cooperation-publisher-v1
  queue: max
  cancel-in-progress: false
jobs:
  collect:
    if: github.repository == 'YouthOpps/data-pipeline' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Create data-source publication token
        id: data-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ vars.WEBSITE_APP_ID }}
          private-key: ${{ secrets.WEBSITE_APP_PRIVATE_KEY }}
          owner: YouthOpps
          repositories: data-source
          permission-contents: write
      - name: Collect and publish this source
        id: collect
        env:
          DATA_SOURCE_TOKEN: ${{ steps.data-token.outputs.token }}
          GITHUB_TOKEN: ${{ github.token }}
          LU_COOPERATION_PACING_BOOTSTRAP: >-
            {"schema":1,"family":"youthopps-lu-luxembourg-cooperation-publisher-v1","not_before":1792067623.4800887,"evidence":"https://github.com/YouthOpps/data-pipeline/issues/35#issuecomment-6192509026"}
          LU_COOPERATION_PACING_ARTIFACT_PATH: ${{ runner.temp }}/pacing-state.json
        run: python -B adapters/lu-luxembourg-cooperation/adapter.py --publish
      - name: Preserve inert publisher pacing state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lu-luxembourg-cooperation-pacing-state-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pacing-state.json
          if-no-files-found: error
          retention-days: 90
