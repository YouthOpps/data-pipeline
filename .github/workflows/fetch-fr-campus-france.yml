name: Fetch CampusBourses factual programmes

on:
  push:
    branches: [main]
    paths:
      - adapters/fr-campus-france/**
      - .github/workflows/fetch-fr-campus-france.yml
  schedule:
    - cron: '38 14 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  queue: max
  group: youthopps-campus-france-publisher-v1
  cancel-in-progress: false

jobs:
  collect:
    if: >-
      github.repository == 'YouthOpps/data-pipeline' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Authenticate data-source publication
        id: token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.WEBSITE_APP_ID }}
          private-key: ${{ secrets.WEBSITE_APP_PRIVATE_KEY }}
          owner: YouthOpps
          repositories: data-source
          permission-contents: write
      - name: Collect and publish reviewed source
        run: python -B adapters/fr-campus-france/adapter.py --publish
        env:
          DATA_SOURCE_TOKEN: ${{ steps.token.outputs.token }}
          GITHUB_TOKEN: ${{ github.token }}
          CAMPUS_FRANCE_PACING_BOOTSTRAP: >-
            {
              "schema": 1,
              "family": "youthopps-campus-france-publisher-v1",
              "not_before": 1792073067.5784223,
              "evidence": "https://github.com/YouthOpps/data-pipeline/issues/30#issuecomment-6194222528",
              "state": {
                "schema": 1,
                "family": "youthopps-campus-france-publisher-v1",
                "observed_at": 1792073007.5784223,
                "not_before": 1792072893.4701095,
                "starts": [
                  1792072947.1247087,
                  1792072961.0327752,
                  1792072974.048758,
                  1792073006.3641808
                ],
                "blocked": false,
                "interval": 12.2,
                "page_interval": 30,
                "rate_limit_strikes": 0,
                "rate_limit_until": 0,
                "completed": 1792073007.5784223
              }
            }
          CAMPUS_FRANCE_PACING_ARTIFACT_PATH: ${{ runner.temp }}/pacing-state.json
      - name: Preserve inert publisher pacing state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: campus-france-pacing-state-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pacing-state.json
          if-no-files-found: error
          retention-days: 90
