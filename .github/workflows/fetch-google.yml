name: Fetch Google student and early-career programmes

on:
  push:
    branches: [main]
    paths:
      - adapters/google/**
      - .github/workflows/fetch-google.yml
  schedule:
    - cron: '9 16 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: youthopps-google-publisher-v1
  cancel-in-progress: false
  queue: max

jobs:
  collect:
    if: >-
      github.repository == 'YouthOpps/data-pipeline' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Authenticate data-source publication
        id: token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.WEBSITE_APP_ID }}
          private-key: ${{ secrets.WEBSITE_APP_PRIVATE_KEY }}
          owner: YouthOpps
          repositories: data-source
          permission-contents: write
      - name: Collect and publish reviewed source
        id: collect
        run: python -B adapters/google/adapter.py --publish
        env:
          DATA_SOURCE_TOKEN: ${{ steps.token.outputs.token }}
          GITHUB_TOKEN: ${{ github.token }}
          GOOGLE_PACING_MAINTENANCE: |-
            {
              "schema": 1,
              "family": "youthopps-google-publisher-v1",
              "evidence": "https://github.com/YouthOpps/data-pipeline/issues/219#issuecomment-6197983326",
              "state": {
                "schema": 2,
                "family": "youthopps-google-publisher-v1",
                "observed_at": 1792084242.4578843,
                "not_before": 1792084261.1371667,
                "starts": [
                  1792060933.2197416,
                  1792060939.4147806,
                  1792060945.9070847,
