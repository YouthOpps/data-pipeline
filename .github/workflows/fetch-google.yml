                "blocked": false,
                "interval": 12.2,
                "completed": 1792084200.1963198,
                "page_interval": 30,
                "last_inventory_completed": 1792083996.9939277,
                "rate_limit_strikes": 0,
                "rate_limit_until": 0,
                "legacy_rate_history_unknown": true
              }
            }
          GOOGLE_PACING_ARTIFACT_PATH: ${{ runner.temp }}/pacing-state.json
      - name: Preserve inert publisher pacing state
        if: always() && steps.collect.outputs.pacing_ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: google-pacing-state-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pacing-state.json
          if-no-files-found: error
          retention-days: 90
