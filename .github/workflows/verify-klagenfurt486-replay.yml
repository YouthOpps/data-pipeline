name: Replay Klagenfurt restrictive startup custody
on:
  push:
    branches: [qa/486-klagenfurt-pending-replay]
permissions:
  actions: read
  contents: read
jobs:
  replay:
    if: github.repository == 'YouthOpps/data-pipeline' && github.event.created && !github.event.deleted && github.run_attempt == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Exercise the pre-collection refusal and archive export on retained bytes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -B qa-486/replay.py
