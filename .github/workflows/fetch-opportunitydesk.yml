          DATA_SOURCE_TOKEN: ${{ steps.data-token.outputs.token }}
        run: python -B adapters/opportunitydesk/adapter.py --publish
      - name: Retain this exact attempt's pacing state
        if: always() && steps.collect.outputs.pacing_ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: opportunitydesk-pacing-state-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pacing-state.json
          if-no-files-found: error
          retention-days: 90
