name: Fetch ONEK youth funding opportunities

on:
  push:
    branches: [main]
    paths:
      - adapters/cy-onek-youth-funds/**
      - .github/workflows/fetch-cy-onek-youth-funds.yml
  schedule:
    - cron: '34 20 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  queue: max
  group: youthopps-onek-publisher-v1
  cancel-in-progress: false

jobs:
  collect:
    if: >-
      github.repository == 'YouthOpps/data-pipeline' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Authenticate data-source publication
        id: token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.WEBSITE_APP_ID }}
          private-key: ${{ secrets.WEBSITE_APP_PRIVATE_KEY }}
          owner: YouthOpps
          repositories: data-source
          permission-contents: write
      - name: Collect and publish reviewed source
        id: collect
        run: python -B adapters/cy-onek-youth-funds/adapter.py --publish
        env:
          DATA_SOURCE_TOKEN: ${{ steps.token.outputs.token }}
          GITHUB_TOKEN: ${{ github.token }}
          ONEK_PACING_BOOTSTRAP: '{"schema":1,"family":"youthopps-onek-publisher-v1","not_before":1791618585.8937042,"evidence":"https://github.com/YouthOpps/data-pipeline/issues/52#issuecomment-6095335317"}'
