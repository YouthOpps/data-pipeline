name: Verify Fulbright Denmark native close handling
on:
  push:
    branches: [qa/490-dk-fulbright-native]
permissions:
  actions: read
  contents: read
  issues: read
  pull-requests: read
concurrency:
  group: youthopps-dk-fulbright-center-publisher-v1
  queue: max
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'YouthOpps/data-pipeline' && github.event.created && !github.event.deleted && github.run_attempt == '1'
    name: Verify Denmark native close handling
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: YouthOpps/youthopps.github.io
          ref: 4b2e3d576f757cc31b798e6d65e5e80af1c585c9
          path: _qa/website
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare the exact before-wire recovery key
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -B qa-denmark490/anchor.py
      - name: Upload the before-wire recovery public key
        id: recovery-key
        uses: actions/upload-artifact@v4
        with:
          name: denmark490-recovery-key-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/denmark490-recovery-key/anchor.json
          if-no-files-found: error
          retention-days: 7
      - name: Run the original Denmark nonpublishing test under reviewed custody
        env:
          GITHUB_TOKEN: ${{ github.token }}
          Denmark_RECOVERY_ANCHOR_ID: ${{ steps.recovery-key.outputs.artifact-id }}
          Denmark_RECOVERY_ANCHOR_DIGEST: ${{ steps.recovery-key.outputs.artifact-digest }}
        run: python -B qa-denmark490/observer.py
      - name: Upload encrypted result and exact owned state evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: denmark490-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/denmark490-native/
          if-no-files-found: error
          retention-days: 7
