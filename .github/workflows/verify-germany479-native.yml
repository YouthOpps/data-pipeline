name: Verify Fulbright Germany native
on:
  push:
    branches: [qa/479-germany-native]
permissions:
  actions: read
  contents: read
  issues: read
  pull-requests: read
concurrency:
  group: youthopps-de-fulbright-germany-publisher-v1
  queue: max
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'YouthOpps/data-pipeline' && github.event.created && !github.event.deleted && github.run_attempt == '1'
    name: Verify Fulbright Germany native
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: YouthOpps/youthopps.github.io
          ref: 0c6ff4818953aca266178c6c5e84cdd90e6f6550
          path: _qa/website
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare the exact before-wire recovery key
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -B qa-479-native/anchor.py
      - name: Upload the before-wire recovery public key
        id: recovery-key
        uses: actions/upload-artifact@v4
        with:
          name: germany479-recovery-key-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/germany479-recovery-key/anchor.json
          if-no-files-found: error
          retention-days: 7
      - name: Run the original Fulbright Germany nonpublishing test under reviewed custody
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GERMANY_RECOVERY_ANCHOR_ID: ${{ steps.recovery-key.outputs.artifact-id }}
          GERMANY_RECOVERY_ANCHOR_DIGEST: ${{ steps.recovery-key.outputs.artifact-digest }}
        run: python -B qa-479-native/observer.py
      - name: Upload encrypted result and exact owned state evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: germany479-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/germany479-native/
          if-no-files-found: error
          retention-days: 7
