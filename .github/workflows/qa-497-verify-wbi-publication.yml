name: Verify WBI publication and all source indexes

on:
  push:
    branches: [qa/497-verify-wbi-publication]

permissions:
  contents: read

jobs:
  verify:
    if: github.repository == 'YouthOpps/data-pipeline' && github.event.created && !github.event.deleted && github.run_attempt == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: YouthOpps/youthopps.github.io
          ref: 7ed4dbeb0963635c92ba700fe9f733475881a079
          path: website
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: YouthOpps/data-source
          ref: 2b22edc0ccd243f8e6dbb85e11485b8145da1639
          path: data-source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build the reviewed site against the exact published data
        working-directory: website
        env:
          DATA_PATH: ${{ github.workspace }}/data-source/datas
        run: npm run build
      - name: Compare published site to the exact data revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python -B .github/qa/verify-live-catalog-44796017283.py
          2b22edc0ccd243f8e6dbb85e11485b8145da1639 be-wbi
          --website-revision 7ed4dbeb0963635c92ba700fe9f733475881a079
          --output ${{ runner.temp }}/live-catalog-44796017283.json
      - name: Verify every live source status, index and sitemap
        run: >-
          python -B .github/qa/verify-live-source-directory-44796017283.py
          2b22edc0ccd243f8e6dbb85e11485b8145da1639
          --website-revision 7ed4dbeb0963635c92ba700fe9f733475881a079
          --output ${{ runner.temp }}/live-source-directory-44796017283.json
      - uses: actions/upload-artifact@v4
        with:
          name: live-catalog-44796017283
          path: |
            ${{ runner.temp }}/live-catalog-44796017283.json
            ${{ runner.temp }}/live-source-directory-44796017283.json
          if-no-files-found: error
          retention-days: 7
