name: fetch-hu-fulbright-hungary
on:
  push:
    branches: [main]
    paths:
      - 'adapters/hu-fulbright-hungary/**'
      - '.github/workflows/fetch-hu-fulbright-hungary.yml'
  workflow_dispatch:
  schedule:
    - cron: '12 17 * * *'
permissions:
  actions: read
  contents: read
concurrency:
  group: youthopps-hu-fulbright-hungary-publisher-v1
  queue: max
  cancel-in-progress: false
jobs:
  collect:
    if: github.repository == 'YouthOpps/data-pipeline' && github.ref == 'refs/heads/main'
