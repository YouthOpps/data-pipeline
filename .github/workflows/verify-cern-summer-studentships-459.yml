name: verify-cern-summer-studentships-459

on:
  push:
    branches: [qa/cern459-native]

permissions:
  actions: read
  contents: read
  issues: read

concurrency:
  group: youthopps-cern-careers-publisher-v1
  cancel-in-progress: false

jobs:
  verify:
    if: true && github.repository == 'YouthOpps/data-pipeline' && github.ref == 'refs/heads/qa/cern459-native' && github.event.created == true && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: YouthOpps/youthopps.github.io
          ref: c74cde5404d0362603047f42d40b73b475cf2d6e
          path: website
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run the one original nonpublishing CERN studentship test
        id: collect
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CERN_PACING_ARTIFACT_PATH: ${{ runner.temp }}/pacing-state.json
        run: python -B qa-cern459/observer.py
      - name: Retain owned state from exact QA execution
        if: always() && steps.collect.outputs.pacing_ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cern-summer-studentships-qa-state-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pacing-state.json
          if-no-files-found: error
          retention-days: 90
      - name: Retain derived evidence and authenticated ciphertext
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cern-summer-studentships-qa-result-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cern459-native-evidence
          if-no-files-found: error
          retention-days: 3
