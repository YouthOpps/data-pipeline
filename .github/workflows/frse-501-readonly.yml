name: FRSE 501 read-only evidence
on:
  push:
    branches: [qa/501-referrer-readonly]
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify production evidence and candidate syntax
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m py_compile adapters/pl-frse/adapter.py
          for job in 139411205500 140087660744; do
            gh api --allow-escape-sequences "repos/$GITHUB_REPOSITORY/actions/jobs/$job/logs" > "$RUNNER_TEMP/$job.log"
          done
          python - <<'PY'
          import os
          from pathlib import Path
          logs = Path(os.environ['RUNNER_TEMP'])
          good = (logs/'139411205500.log').read_text()
          failed = (logs/'140087660744.log').read_text()
          path = 'https://eduinspiracje.org.pl/eduinspiracje/'
          assert path + 'o-konkursie", "publisher explicitly requires nomination"' in good
          assert path + 'regulamin", "supporting catalogue or rules, not another call"' in good
          assert 'HTTP 404: ' + path + 'regulamin' in failed
          import re
          for name, log in [('success',good),('failure',failed)]:
              starts = re.findall(r'"event": "request_start", "url": "([^"]+)"', log)
              rules = starts.index(path + 'regulamin')
              assert starts[rules-1] == path + 'o-konkursie'
              assert starts.index('https://www.frse.org.pl/konkursy') < rules
              if name == 'success':
                  assert rules < starts.index('https://www.frse.org.pl/praca-w-frse')
              else:
                  assert 'https://www.frse.org.pl/praca-w-frse' not in starts
              print(name, 'fetch order confirms competition catalogue candidates preceded the jobs seed')
          print('Production classification and failed URL match.')
          PY
      - uses: actions/checkout@v4
        with:
          repository: YouthOpps/youthopps.github.io
          ref: 16988009c49f282cec94f33dc3677a370abea0c5
          path: website
          persist-credentials: false
      - name: Verify pinned FRSE publication through the raw and expiry-filtered consumer
        env:
          DATA_REV: 4be7cae4f3916eb524da350936e4c3d734fb240a
        run: |
          test "$(git -C website ls-tree HEAD data-source | cut -f1 | awk '{print $3}')" = "$DATA_REV"
          mkdir -p "$RUNNER_TEMP/raw/pl-frse" "$RUNNER_TEMP/filtered/pl-frse"
          for name in data metadata; do
            curl --silent --show-error --fail "https://raw.githubusercontent.com/YouthOpps/data-source/$DATA_REV/datas/pl-frse/$name.json" > "$RUNNER_TEMP/raw/pl-frse/$name.json"
          done
          python - <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, 'adapters/pl-frse')
          import adapter
          root = Path(os.environ['RUNNER_TEMP'])
          records = json.loads((root/'raw/pl-frse/data.json').read_text())
          meta = json.loads((root/'raw/pl-frse/metadata.json').read_text())
          assert len(records) == 63
          current = adapter.remove_expired_records(records, adapter.utc_now())
          folder = root/'filtered/pl-frse'
          (folder/'data.json').write_text(json.dumps(current))
          (folder/'metadata.json').write_text(json.dumps(adapter.metadata(adapter.utc_now(), {}, current)))
          print(f'Pinned raw records: {len(records)}; current after source expiry filtering: {len(current)}')
          PY
          node --input-type=module <<'JS'
          import {readFile} from 'node:fs/promises';
          import assert from 'node:assert/strict';
          import {loadData} from './website/scripts/data.mjs';
          for (const kind of ['raw','filtered']) {
            const root = process.env.RUNNER_TEMP + '/' + kind;
            const expected = JSON.parse(await readFile(root + '/pl-frse/data.json','utf8'));
            const parsed = await loadData(root);
            assert.deepEqual(parsed.opportunities.map(x=>x.id).sort(), expected.map(x=>x.id).sort());
            console.log(kind, parsed.opportunities.length, 'exact IDs accepted');
          }
          JS
      - name: Exercise the original owned decoder and maintenance MAX without contacting FRSE
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -B - <<'PY'
          import copy, sys
          sys.path.insert(0, 'adapters/pl-frse')
          import adapter as a
          with a.execution(), a.phase("preparation", 150):
              identity = (45871463683, 1, 'pl-frse')
              run = a.workflow_api('/actions/runs/45871463683/attempts/1')
              obj = a.workflow_api('/actions/artifacts/15144177944')
              head = 'd0c2731027b50c6e85928883133c38cfe8153053'
              digest = 'sha256:5860e76953a5c2add277e6596cadb957ff2d6fcef5e18c918331aabf6ed5b229'
              assert run['workflow_id'] == a._LOCAL_WORKFLOW_ID and run['id'] == identity[0]
              assert run['head_sha'] == head and run['head_branch'] == 'main' and run['conclusion'] == 'failure'
              assert obj['workflow_run']['id'] == identity[0] and obj['workflow_run']['head_sha'] == head
              assert obj['digest'] == digest and not obj['expired']
              a._ATTEMPT_HEADS[identity[:2]] = head
              original = a.download_inert_artifact(identity, 15144177944, digest)
              assert not original['blocked'] and not original['in_flight']
              merged = a.production_maintenance_state(original)
              for key in ("until","interval","page_gap","completed","inventory_completed",
                          "observed_429_since_transition","rate_limit_until"):
                  assert merged[key] >= original[key] and merged[key] >= a._EDU_QA_STATE[key]
              assert set(a._EDU_QA_STATE["starts"]).issubset(merged["starts"])
              assert set(original["starts"]).issubset(merged["starts"])
              current = a._EDU_QA_STATE
              a._EDU_QA_STATE = dict(current, page_gap=current["page_gap"]+1)
              try:
                  a.production_maintenance_state(original)
              except a.AdapterError as error:
                  assert error.stage == "access"
              else:
                  raise AssertionError("Mutated QA handback must not be accepted")
              finally:
                  a._EDU_QA_STATE = current
              incoming = dict(original, blocked=True, in_flight=True,
                              interval=max(90, original["interval"]),page_gap=max(120, original["page_gap"]))
              protected = a.production_maintenance_state(incoming)
              assert protected["blocked"] and protected["in_flight"]
              assert protected["interval"] >= 90 and protected["page_gap"] >= 120
              print("Exact new handback, stronger incoming constraints and corrupted-state refusal passed")
              more = copy.deepcopy(original)
              more.update(interval=max(90, more['interval']), page_gap=max(120, more['page_gap']), blocked=True, in_flight=True)
              result = a.merge_budget(merged, more)
              assert result['interval'] >= 90 and result['page_gap'] >= 120
              assert result['blocked'] and result['in_flight']
              assert set(original['starts']).issubset(result['starts'])
              assert result['research_provenance'] == original['research_provenance']
              print('Authentic owned archive decoded. Stronger constraints, holds, pending state, starts and provenance preserved in memory.')
          PY
      - name: Exercise fail-closed controls on the narrow rules exclusion
        run: |
          python -B - <<'PY'
          import sys
          sys.path.insert(0, 'adapters/pl-frse')
          import adapter as a
          catalog, other = a.SOURCE_URL+'konkursy', a.SOURCE_URL+'independent'
          rules = a._EDU_RULES
          award = a._EDU_AWARD_PAGES[rules]
          def page(text):
              return a.document_root('<html><body><main><section class="text_page"><p>'+text+'</p></section></main></body></html>')
          def decision(text='nie ma możliwości samodzielnego zgłoszenia', other_text='Other call', links=None, parents=None):
              pages = {award:page(text), other:page(other_text), catalog:page('catalogue')}
              return a.verified_award_overview(rules, pages, {award, other, rules},
                  [('award', [award,rules] if links is None else links, None)],
                  {catalog, award} if parents is None else parents)
          assert decision()
          assert not decision(text='Open applications')
          assert not decision(links=[rules])
          assert not decision(links=[award])
          assert not decision(parents={award})
          assert not decision(parents={catalog,other})
          assert not decision(other_text='<a href="'+rules+'#conditions">Conditions</a>')
          rules = a._EDU_PRIMARY_RULES
          award = a._EDU_AWARD_PAGES[rules]
          self_apply = "Należy zgłosić swoją kandydaturę poprzez wypełnienie formularza zgłoszeniowego"
          assert decision(text=self_apply)
          assert not decision(text="Open applications")
          assert not decision(text=self_apply + "; nie ma możliwości samodzielnego zgłoszenia")
          assert a.record_identity(award) == a.record_identity(rules)
          overview = '<h1>EDUinspirator</h1>'+self_apply
          doc = page(overview)
          inventory = ({award:doc}, {award:"competitions"},
                       [("Konkurs EDUinspirator",[award,rules],None)], {})
          rows = a.parse_inventory(inventory)
          assert len(rows) == 1 and rows[0]["url"] == award
          assert rows[0]["id"] == a.record_identity(rules)
          assert (rows[0]["kind"],rows[0]["status"]) == ("programme-overview","unknown")
          assert any("current terms" in note for note in rows[0]["limitations"])
          print('Nomination, genuine self-application, identity, rejection and fallback controls passed')
          PY
      - name: Compare live YouthOpps FRSE indices and sitemap with the website data pin
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          import json, os, urllib.request, urllib.parse, xml.etree.ElementTree as ET
          from pathlib import Path
          class Index(HTMLParser):
              def __init__(self):
                  super().__init__(); self.urls=[]
              def handle_starttag(self,tag,attrs):
                  attrs=dict(attrs)
                  if "collection" in attrs.get("class","").split() and attrs.get("data-index"):
                      self.urls.append(attrs["data-index"])
          site="https://youthopps.org"
          def fetch(path):
              url=urllib.parse.urljoin(site,path)
              assert urllib.parse.urlsplit(url).netloc == 'youthopps.org'
              request=urllib.request.Request(url,headers={"User-Agent":"YouthOppsBot/1.0 (+https://youthopps.org/bot/)","Cache-Control":"no-cache"})
              with urllib.request.urlopen(request,timeout=40) as res: return res.read()
          def index(path):
              parser=Index(); parser.feed(fetch(path).decode())
              assert len(parser.urls)==1
              return json.loads(fetch(parser.urls[0]))
          pinned=json.loads((Path(os.environ["RUNNER_TEMP"])/"raw/pl-frse/data.json").read_text())
          expected={r["id"] for r in pinned}
          global_rows=index("/opportunities/")
          source_rows=index("/sources/publisher/pl-frse/")
          root=ET.fromstring(fetch("/sitemap.xml"))
          links=[item.text for item in root.iter() if item.tag.endswith("}loc")]
          shards=[link for link in links if "sitemap-source-pl-frse" in link]
          assert shards, links[:3]
          sitemap=set()
          for shard in shards:
              for loc in ET.fromstring(fetch(shard)).iter():
                  if loc.tag.endswith("}loc"):
                      sitemap.add(urllib.parse.urlsplit(loc.text).path.rstrip("/").split("/")[-1])
          actual={r["id"] for r in source_rows}
          print("FRSE published",len(expected),"source index",len(actual),"global",sum(r["source"]=="pl-frse" for r in global_rows),"sitemap",len(sitemap))
          assert expected==actual==sitemap=={r["id"] for r in global_rows if r["source"]=="pl-frse"}
          PY
