name: FRSE 501 read-only evidence
on:
  push:
    branches: [qa/501-referrer-readonly]
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify production evidence and candidate syntax
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m py_compile adapters/pl-frse/adapter.py
          for job in 139411205500 140087660744; do
            gh api --allow-escape-sequences "repos/$GITHUB_REPOSITORY/actions/jobs/$job/logs" > "$RUNNER_TEMP/$job.log"
          done
          python - <<'PY'
          import os
          from pathlib import Path
          logs = Path(os.environ['RUNNER_TEMP'])
          good = (logs/'139411205500.log').read_text()
          failed = (logs/'140087660744.log').read_text()
          path = 'https://eduinspiracje.org.pl/eduinspiracje/'
          assert path + 'o-konkursie", "publisher explicitly requires nomination"' in good
          assert path + 'regulamin", "supporting catalogue or rules, not another call"' in good
          assert 'HTTP 404: ' + path + 'regulamin' in failed
          import re
          for name, log in [('success',good),('failure',failed)]:
              starts = re.findall(r'"event": "request_start", "url": "([^"]+)"', log)
              rules = starts.index(path + 'regulamin')
              assert starts[rules-1] == path + 'o-konkursie'
              assert starts.index('https://www.frse.org.pl/konkursy') < rules
              if name == 'success':
                  assert rules < starts.index('https://www.frse.org.pl/praca-w-frse')
              else:
                  assert 'https://www.frse.org.pl/praca-w-frse' not in starts
              print(name, 'fetch order confirms competition catalogue candidates preceded the jobs seed')
          print('Production classification and failed URL match.')
          PY
      - uses: actions/checkout@v4
        with:
          repository: YouthOpps/youthopps.github.io
          ref: 16988009c49f282cec94f33dc3677a370abea0c5
          path: website
          persist-credentials: false
      - name: Verify pinned FRSE publication through the raw and expiry-filtered consumer
        env:
          DATA_REV: 4be7cae4f3916eb524da350936e4c3d734fb240a
        run: |
          test "$(git -C website ls-tree HEAD data-source | cut -f1 | awk '{print $3}')" = "$DATA_REV"
          mkdir -p "$RUNNER_TEMP/raw/pl-frse" "$RUNNER_TEMP/filtered/pl-frse"
          for name in data metadata; do
            curl --silent --show-error --fail "https://raw.githubusercontent.com/YouthOpps/data-source/$DATA_REV/datas/pl-frse/$name.json" > "$RUNNER_TEMP/raw/pl-frse/$name.json"
          done
          python - <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, 'adapters/pl-frse')
          import adapter
          root = Path(os.environ['RUNNER_TEMP'])
          records = json.loads((root/'raw/pl-frse/data.json').read_text())
          meta = json.loads((root/'raw/pl-frse/metadata.json').read_text())
          assert len(records) == 63
          current = adapter.remove_expired_records(records, adapter.utc_now())
          folder = root/'filtered/pl-frse'
          (folder/'data.json').write_text(json.dumps(current))
          (folder/'metadata.json').write_text(json.dumps(adapter.metadata(adapter.utc_now(), {}, current)))
          print(f'Pinned raw records: {len(records)}; current after source expiry filtering: {len(current)}')
          PY
          node --input-type=module <<'JS'
          import {readFile} from 'node:fs/promises';
          import assert from 'node:assert/strict';
          import {loadData} from './website/scripts/data.mjs';
          for (const kind of ['raw','filtered']) {
            const root = process.env.RUNNER_TEMP + '/' + kind;
            const expected = JSON.parse(await readFile(root + '/pl-frse/data.json','utf8'));
            const parsed = await loadData(root);
            assert.deepEqual(parsed.opportunities.map(x=>x.id).sort(), expected.map(x=>x.id).sort());
            console.log(kind, parsed.opportunities.length, 'exact IDs accepted');
          }
          JS
