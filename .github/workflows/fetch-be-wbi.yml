name: fetch-be-wbi
on:
  push:
    branches: [main]
    paths:
      - 'adapters/be-wbi/**'
      - '.github/workflows/fetch-be-wbi.yml'
  workflow_dispatch:
  schedule:
    - cron: '11 7 * * *'
permissions:
  actions: read
  contents: read
concurrency:
  group: youthopps-be-wbi-publisher-v1
  queue: max
  cancel-in-progress: false
jobs:
  collect:
    if: github.repository == 'YouthOpps/data-pipeline' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Create data-source publication token
        id: data-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ vars.WEBSITE_APP_ID }}
          private-key: ${{ secrets.WEBSITE_APP_PRIVATE_KEY }}
          owner: YouthOpps
          repositories: data-source
          permission-contents: write
      - name: Collect and publish this source
        id: collect
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WBI_PACING_ARTIFACT_PATH: ${{ runner.temp }}/pacing-state.json
          DATA_SOURCE_TOKEN: ${{ steps.data-token.outputs.token }}
        run: python -B adapters/be-wbi/adapter.py --publish
      - name: Retain this exact attempt publisher state
        if: always() && steps.collect.outputs.pacing_ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: be-wbi-pacing-state-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pacing-state.json
          if-no-files-found: error
          retention-days: 90
