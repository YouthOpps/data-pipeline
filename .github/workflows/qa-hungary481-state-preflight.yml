name: Verify exact Hungary custody handback
on:
  push:
    branches: [qa/hungary481-state-preflight]
permissions:
  actions: read
  contents: read
jobs:
  preflight:
    if: github.repository == 'YouthOpps/data-pipeline' && github.event.created && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconcile original GitHub archives without publisher access
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -B qa/hungary481-state-preflight/check.py
