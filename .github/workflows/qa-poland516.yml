name: Verify Poland pre-access recovery controls
on:
  push:
    branches: [qa/poland516-controls]
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run inert actual-function controls
        run: |
          python -B - <<'PYCODE'
          import base64,sys
          sys.argv=['controls','adapters/pl-fulbright-poland/adapter.py']
          exec(compile(base64.b64decode(''),'<controls>','exec'))
          PYCODE
      - uses: actions/checkout@v4
        with:
          repository: YouthOpps/youthopps.github.io
          ref: 1b13d658488111d61f8aabcc5ae9a3565b9bc62c
          path: website
          persist-credentials: false
      - name: Inspect genuine preceding state and unchanged collector
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -B - <<'PYCODE'
          import base64
          exec(compile(base64.b64decode(''),'<maintenance>','exec'))
          PYCODE
      - name: Validate current complete published input with actual consumer
        run: |
          node --input-type=module <<'JS'
          import {readFile} from 'node:fs/promises';
          import assert from 'node:assert/strict';
          import {loadData} from './website/scripts/data.mjs';
          const rows=JSON.parse(await readFile('/dev/shm/poland516-consumer/pl-fulbright-poland/data.json','utf8'));
          const result=await loadData('/dev/shm/poland516-consumer');
          assert.deepEqual(result.opportunities.map(x=>x.id).sort(),rows.map(x=>x.id).sort());
          console.log('Current published maintenance input accepted',rows.length);
          JS
