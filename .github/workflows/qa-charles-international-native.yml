name: qa-charles-international-native
on:
  push:
    branches: [qa/charles-international-native]
permissions:
  actions: read
  contents: read
concurrency:
  group: youthopps-cz-charles-university-publisher-v1
  queue: max
  cancel-in-progress: false
jobs:
  native:
    if: github.repository == 'YouthOpps/data-pipeline' && github.ref == 'refs/heads/qa/charles-international-native' && github.run_attempt == 1 && github.event.created == true
    runs-on: ubuntu-latest
    timeout-minutes: 33
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: YouthOpps/youthopps.github.io
          ref: 7da2b3eb81853707def0ff67de64f8d43773fe87
          path: qa-website
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run the original complete nonpublishing Charles native test
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -B qa/charles-native/runner.py
      - name: Retain isolated native state and encrypted capture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: charles-international-native-${{ github.run_attempt }}
          path: ${{ runner.temp }}/charles-international-native/
          if-no-files-found: ignore
          retention-days: 90
