name: Verify BMW policy mismatch diagnostics
on:
  push:
    branches: [qa/494-policy-fingerprint]
permissions:
  contents: read
jobs:
  controlled:
    if: github.event.created && github.run_attempt == '1' && github.repository == 'YouthOpps/data-pipeline'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python -B .github/qa/verify-bmw494.py
