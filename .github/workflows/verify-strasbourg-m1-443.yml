name: verify-strasbourg-m1-443

on:
  push:
    branches: [qa/443-strasbourg-m1-native]

permissions:
  actions: read
  contents: read
  issues: read

concurrency:
  group: youthopps-universite-de-strasbourg-publisher-v1
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'YouthOpps/data-pipeline' && github.ref == 'refs/heads/qa/443-strasbourg-m1-native' && github.event.created == true && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: YouthOpps/youthopps.github.io
          ref: b8228fdd28e18a5e0cccec007ccfe04052cdfe0a
          path: website
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run the one original nonpublishing Strasbourg M1 admissions test
        id: collect
        env:
          GITHUB_TOKEN: ${{ github.token }}
          STRASBOURG_PACING_ARTIFACT_PATH: ${{ runner.temp }}/pacing-state.json
        run: python -B qa-strasbourg443/observer.py
      - name: Retain owned state from exact QA execution
        if: always() && steps.collect.outputs.pacing_ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: fr-universite-de-strasbourg-m1-admissions-qa-state-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pacing-state.json
          if-no-files-found: error
          retention-days: 90
      - name: Retain derived evidence and authenticated ciphertext
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fr-universite-de-strasbourg-m1-admissions-qa-result-${{ github.run_attempt }}
          path: ${{ runner.temp }}/strasbourg443-native-evidence
          if-no-files-found: error
          retention-days: 3
