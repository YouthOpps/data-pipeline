name: Verify BMW policy restoration offline
on:
  push:
    branches: [qa/494-structure-replay]
permissions:
  contents: read
  actions: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -B .github/qa/check-bmw494-release.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
