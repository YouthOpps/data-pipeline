name: Verify rejected pladis sitemap diagnostics
on:
  push:
    branches: [qa/495-safe-sitemap-evidence-v2]
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'YouthOpps/data-pipeline' && github.event.created && github.run_attempt == 1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python -B qa/495/check.py
