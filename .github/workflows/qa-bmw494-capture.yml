name: Capture the changed BMW legal notice
on:
  push:
    branches: [qa/494-legal-body]
permissions:
  actions: read
  contents: read
  issues: read
concurrency:
  group: youthopps-bmw-group-publisher-v1
  cancel-in-progress: false
jobs:
  capture:
    if: github.repository == 'YouthOpps/data-pipeline' && github.run_attempt == 1 && github.event.created
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Research only the changed official policy
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -B .github/qa/bmw494/capture.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bmw494-changed-policy
          path: ${{ runner.temp }}/bmw494-evidence/
          retention-days: 30
          if-no-files-found: error
