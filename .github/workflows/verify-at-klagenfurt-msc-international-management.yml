name: verify-at-klagenfurt-msc-international-management
on:
  push:
    branches:
      - 'qa/442-klagenfurt-native-5b50d7988e79a41e'
permissions:
  actions: read
  contents: read
concurrency:
  group: youthopps-klagenfurt-publisher-v1
  queue: max
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'YouthOpps/data-pipeline' && github.run_attempt == 1 && github.event.created && github.event.before == '0000000000000000000000000000000000000000'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: YouthOpps/youthopps.github.io
          ref: b8228fdd28e18a5e0cccec007ccfe04052cdfe0a
          path: _qa/website
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run the original sole nonpublishing test
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -B .github/qa/klagenfurt442-observer.py
      - name: Retain original encrypted evidence and exact state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: klagenfurt442-native-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/klagenfurt442-native-evidence/
          if-no-files-found: error
          retention-days: 14
