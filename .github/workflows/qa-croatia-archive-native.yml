name: qa-croatia-archive-native
on:
  push:
    branches: [qa/croatia-archive-native]
permissions:
  actions: read
  issues: read
  contents: read
concurrency:
  group: youthopps-studyincroatia-publisher-v1
  queue: max
  cancel-in-progress: false
jobs:
  native:
    if: github.repository == 'YouthOpps/data-pipeline' && github.ref == 'refs/heads/qa/croatia-archive-native' && github.run_attempt == 1 && github.event.created == true
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: YouthOpps/youthopps.github.io
          ref: 11e66b0107956ed82b9918206e18d8e8fc6778b1
          path: website
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify the original Study in Croatia collection and consumer
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -B qa/croatia-archive/runner.py
      - name: Retain timing evidence and encrypted capture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: croatia-archive-native-${{ github.run_attempt }}
          path: ${{ runner.temp }}/croatia-archive-native/
          if-no-files-found: ignore
          retention-days: 7
